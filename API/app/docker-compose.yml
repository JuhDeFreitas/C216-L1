version: "3.9"

services:

  db:

    image: postgres:13

    container_name: alunos_db
    

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alunos_db

    ports:
      - "5432:5432"


  api:

    build: .

    container_name: alunos_api

    working_dir: /workspace

    ports:
      - "8000:8000"

    depends_on:
      - db

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/alunos_db